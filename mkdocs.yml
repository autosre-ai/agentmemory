# MkDocs configuration for Agent Memory Toolkit
site_name: Agent Memory Toolkit
site_description: Hybrid retrieval memory for AI agents that actually remembers
site_url: https://autosre-ai.github.io/agent-memory-toolkit/
repo_url: https://github.com/autosre-ai/agent-memory-toolkit
repo_name: autosre-ai/agent-memory-toolkit
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Quick Start: quickstart.md
  - API Reference: api-reference.md
  - MCP Server: mcp-server.md
  - Clustering: clustering.md
  - Search: search.md
  - Temporal: temporal.md
  - Graph: graph.md
  - Observability: observability.md
  - Benchmarks: benchmarks.md
  - Architecture: architecture.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/autosre-ai/agent-memory-toolkit
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/agent-memory-toolkit/

copyright: Copyright &copy; 2024 autosre.ai
