# Prometheus scrape config for Agent Memory Toolkit
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'amt-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    scheme: http

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
