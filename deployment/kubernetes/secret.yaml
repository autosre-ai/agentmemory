# Agent Memory Toolkit - Kubernetes Secret
# Sensitive configuration data (base64 encoded)
# NOTE: In production, use a secrets management solution like:
#   - Kubernetes Secrets with encryption at rest
#   - HashiCorp Vault
#   - AWS Secrets Manager
#   - Azure Key Vault
#   - Google Secret Manager

apiVersion: v1
kind: Secret
metadata:
  name: amt-secrets
  namespace: agent-memory
  labels:
    app: agent-memory-toolkit
    component: secrets
type: Opaque
stringData:
  # JWT Secret Key - CHANGE THIS IN PRODUCTION!
  # Generate with: openssl rand -base64 32
  AMT_JWT_SECRET: "change-me-in-production-use-strong-random-key"
  
  # Default passwords - CHANGE THESE IN PRODUCTION!
  AMT_ADMIN_PASSWORD: "admin"
  AMT_AGENT_PASSWORD: "agent"
