[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_memory_toolkit*"]

[project]
name = "agent-memory-toolkit"
version = "0.2.0"
description = "Hybrid retrieval memory for AI agents - BM25 + vectors + knowledge graph with RRF fusion"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = [
    "ai",
    "agents", 
    "memory",
    "sqlite",
    "fts5",
    "embeddings",
    "vector-search",
    "bm25",
    "rag",
    "knowledge-graph",
    "llm",
    "mcp",
    "model-context-protocol",
    "langchain",
    "llamaindex",
]
authors = [
    {name = "Sri Sainath Adusumilli", email = "sri@autosre.ai"}
]
maintainers = [
    {name = "Sri Sainath Adusumilli", email = "sri@autosre.ai"}
]

dependencies = [
    "click>=8.0.0",
    "filelock>=3.0.0",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
]
compression = [
    "tiktoken>=0.5.0",
]
mcp = [
    "mcp>=1.0.0",
]
api = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pyjwt>=2.8.0",
    "pydantic>=2.5.0",
]
cluster = [
    "redis[hiredis]>=5.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0",
]
langchain = [
    "langchain-core>=0.1.0",
]
llamaindex = [
    "llama-index-core>=0.10.0",
]
all = [
    "agent-memory-toolkit[embeddings,compression,mcp,api,cluster,dev,docs,langchain,llamaindex]",
]

[project.scripts]
amt = "agent_memory_toolkit.cli:main"
agent-memory-toolkit = "agent_memory_toolkit.cli:main"
amt-mcp = "agent_memory_toolkit.mcp.cli:main"

[project.entry-points."hermes.plugins"]
agent-memory-toolkit = "agent_memory_toolkit.plugins.hermes:plugin"

[project.urls]
Homepage = "https://github.com/autosre-ai/agent-memory-toolkit"
Documentation = "https://autosre-ai.github.io/agent-memory-toolkit/"
Repository = "https://github.com/autosre-ai/agent-memory-toolkit"
Issues = "https://github.com/autosre-ai/agent-memory-toolkit/issues"
Changelog = "https://github.com/autosre-ai/agent-memory-toolkit/blob/main/CHANGELOG.md"
Discussions = "https://github.com/autosre-ai/agent-memory-toolkit/discussions"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py310"
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "W",      # pycodestyle warnings
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "ISC",    # flake8-implicit-str-concat
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.isort]
known-first-party = ["agent_memory_toolkit"]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"]  # allow assert statements in tests

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "sentence_transformers.*",
    "torch.*",
    "tiktoken.*",
    "mcp.*",
    "langchain_core.*",
    "llama_index.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["agent_memory_toolkit"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
